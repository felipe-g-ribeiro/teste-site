<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BeautyGlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Navegação -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="fas fa-sparkles text-primary"></i> BeautyGlow
            </a>
            <a href="../index.html" class="btn btn-outline-secondary ms-auto">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>
    </nav>

    <!-- Conteúdo Checkout -->
    <div class="container my-5">
        <h1 class="mb-4"><i class="fas fa-shopping-bag"></i> Finalizar Pedido</h1>

        <div class="row g-4">
            <!-- Coluna Esquerda - Formulário -->
            <div class="col-lg-8">
                <!-- Dados Pessoais -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="fas fa-user"></i> Dados Pessoais</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="fullName" placeholder="João Silva">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" placeholder="joao@exemplo.com">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Telefone *</label>
                                <input type="tel" class="form-control" id="phone" placeholder="(11) 99999-9999">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPF *</label>
                                <input type="text" class="form-control" id="cpf" placeholder="123.456.789-10">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Endereço de Entrega -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="fas fa-map-marker-alt"></i> Endereço de Entrega</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">CEP *</label>
                                <input type="text" class="form-control" id="cep" placeholder="01234-567">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">&nbsp;</label>
                                <button class="btn btn-outline-primary w-100" type="button">Buscar CEP</button>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Rua *</label>
                                <input type="text" class="form-control" id="street" placeholder="Rua exemplo">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Número *</label>
                                <input type="text" class="form-control" id="number" placeholder="123">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Complemento</label>
                                <input type="text" class="form-control" id="complement" placeholder="Apto 456">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Bairro *</label>
                                <input type="text" class="form-control" id="neighborhood" placeholder="Bairro">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cidade *</label>
                                <input type="text" class="form-control" id="city" placeholder="São Paulo">
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Estado *</label>
                                <select class="form-select" id="state">
                                    <option value="">Selecione o estado</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="BA">Bahia</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="PR">Paraná</option>
                                    <option value="SC">Santa Catarina</option>
                                    <option value="PE">Pernambuco</option>
                                    <option value="DF">Distrito Federal</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Método de Entrega -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="fas fa-box"></i> Método de Entrega</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="shipping" id="shipping1" value="standard"
                                checked>
                            <label class="form-check-label" for="shipping1">
                                <strong>Entrega Padrão (5-7 dias)</strong> - R$ 12,50
                                <br><small class="text-muted">Chegará entre segunda e quarta-feira</small>
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="shipping" id="shipping2" value="express">
                            <label class="form-check-label" for="shipping2">
                                <strong>Entrega Express (2-3 dias)</strong> - R$ 29,90
                                <br><small class="text-muted">Chegará em até 3 dias úteis</small>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="shipping" id="shipping3"
                                value="next-day">
                            <label class="form-check-label" for="shipping3">
                                <strong>Entrega Next Day (1 dia)</strong> - R$ 49,90
                                <br><small class="text-muted">Chegará no próximo dia útil</small>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Método de Pagamento -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="fas fa-credit-card"></i> Método de Pagamento</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="payment" id="payment1" value="credit"
                                checked>
                            <label class="form-check-label" for="payment1">
                                <strong>Cartão de Crédito</strong>
                            </label>
                        </div>

                        <div id="creditCardForm" class="mb-3">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Número do Cartão *</label>
                                    <input type="text" class="form-control" id="cardNumber"
                                        placeholder="1234 5678 9012 3456" maxlength="19">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Validade *</label>
                                    <input type="text" class="form-control" id="cardExpiry" placeholder="MM/AA"
                                        maxlength="5">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">CVV *</label>
                                    <input type="text" class="form-control" id="cardCVV" placeholder="123"
                                        maxlength="3">
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Nome no Cartão *</label>
                                    <input type="text" class="form-control" id="cardName" placeholder="JOÃO SILVA">
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Parcelamento *</label>
                                    <select class="form-select" id="installments">
                                        <option value="1">À vista</option>
                                        <option value="2">2x sem juros</option>
                                        <option value="3">3x sem juros</option>
                                        <option value="6">6x com juros</option>
                                        <option value="12">12x com juros</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="payment" id="payment2" value="pix">
                            <label class="form-check-label" for="payment2">
                                <strong>PIX (Pague agora e ganhe 5% de desconto)</strong>
                            </label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="payment" id="payment3" value="boleto">
                            <label class="form-check-label" for="payment3">
                                <strong>Boleto Bancário</strong>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Termos e Condições -->
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label" for="terms">
                        Concordo com os <a href="#" class="text-decoration-none">termos e condições</a> e <a href="#"
                            class="text-decoration-none">política de privacidade</a>
                    </label>
                </div>
            </div>

            <!-- Coluna Direita - Resumo -->
            <div class="col-lg-4">
                <div class="card sticky-top" style="top: 20px;">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Resumo do Pedido</h5>
                    </div>
                    <div class="card-body">
                        <div id="order-summary" class="mb-3" style="max-height: 300px; overflow-y: auto;">
                            <!-- Itens do carrinho serão carregados aqui -->
                        </div>

                        <div class="border-top border-bottom py-3 mb-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <strong id="summary-subtotal">R$ 0,00</strong>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Frete:</span>
                                <strong id="summary-shipping">R$ 12,50</strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Desconto:</span>
                                <strong id="summary-discount" class="text-success">-R$ 0,00</strong>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                            <span>Total:</span>
                            <span id="summary-total">R$ 0,00</span>
                        </div>

                        <button class="btn btn-primary w-100 btn-lg" id="checkout-btn" onclick="finishPurchase()">
                            <i class="fas fa-lock"></i> Finalizar Compra
                        </button>

                        <button class="btn btn-outline-secondary w-100 mt-2" onclick="window.history.back()">
                            Voltar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2024 BeautyGlow. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/checkout.js"></script>
</body>

</html>
